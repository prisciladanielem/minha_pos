services:
  postgres:
    image: postgres:18
    container_name: minha-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minha_pos
      POSTGRES_USER: minha_pos
      POSTGRES_PASSWORD: minha_pos_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: